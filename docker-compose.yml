services:
  db:
    image: mysql:8.0
    container_name: ri-leave-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: lms_root_pw
      MYSQL_DATABASE: lms_db
    ports:
      # 3307 on the host: the machine's own MariaDB already holds 3306
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plms_root_pw"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build: .
    container_name: ri-leave-web
    restart: unless-stopped
    ports:
      # APP_URL in config/constants.php is http://localhost:8000
      - "8000:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: lms_db
      DB_USER: root
      DB_PASS: lms_root_pw
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
