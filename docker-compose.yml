services:
  db:
    image: mysql:8.0
    container_name: ri-leave-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: lms_root_pw
      MYSQL_DATABASE: lms_db
    ports:
      # 3307 on the host: the machine's own MariaDB already holds 3306
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plms_root_pw"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build: .
    container_name: ri-leave-web
    restart: unless-stopped
    ports:
      # Matches the APP_URL below. Change both together or links break.
      - "8000:80"
    volumes:
      - ./:/var/www/html
    environment:
      # The address links and asset paths are built from. Development only:
      # a real server sets this in config/local.php, which wins over the
      # environment. See config/local.php.example.
      APP_URL: "http://localhost:8000"

      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: lms_db
      DB_USER: root
      DB_PASS: lms_root_pw

      # Outgoing email. Off here on purpose: a development container that can
      # send mail will send it to real staff addresses the first time somebody
      # tests an approval. Turn it on where it is meant to be sending from.
      MAIL_ENABLED: "false"
      MAIL_HOST: mail.realnet.co.sz
      MAIL_PORT: "25"
      # mail.realnet.co.sz offers neither STARTTLS nor AUTH and relays on the
      # calling address, so both of these stay empty. See config/constants.php.
      MAIL_ENCRYPTION: ""
      MAIL_USERNAME: ""
      # Never written here. Passed through from the host when the server has one:
      #   MAIL_PASSWORD=... docker compose up -d
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"

      # Set this to your own address before turning MAIL_ENABLED on anywhere
      # that is not production. The database is seeded from the real staff
      # roster, so without it one test approval mails thirty colleagues.
      MAIL_REDIRECT_TO: "${MAIL_REDIRECT_TO:-}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
